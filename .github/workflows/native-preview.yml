name: ToolHub Pocket native previews
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/toolhub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm test
      - run: npm run bundle && npx cap sync android
      - run: bash android/gradlew -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: toolhub-pocket-android-debug
          path: mobile/toolhub/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/toolhub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run bundle && npx cap sync ios
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath build-ios CODE_SIGNING_ALLOWED=NO build
      - run: ditto -c -k --sequesterRsrc --keepParent build-ios/Build/Products/Debug-iphonesimulator/App.app toolhub-pocket-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: toolhub-pocket-ios-simulator
          path: mobile/toolhub/toolhub-pocket-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
